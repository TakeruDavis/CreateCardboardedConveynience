plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "cardboarded_conveynience-common.mixins.json"
    }

    runs {
        server {
            server()
            name "Forge Server"
            ideConfigGenerated true
        }

        gameTestServer {
            server()
            name "Game Test Server"
            property "forge.enabledGameTestNamespaces", "cardboarded_conveynience"
            // Enable game test mode
            property "forge.gameTestServer", "true"
            vmArg "-Dforge.gameTestServer=true"
        }
    }
}

// Configure server.properties for offline mode
tasks.register("configureServerOfflineMode") {
    doLast {
        def serverProps = file("run/server.properties")
        if (serverProps.exists()) {
            def content = serverProps.text
            if (content.contains("online-mode=true")) {
                serverProps.text = content.replace("online-mode=true", "online-mode=false")
                println "Set online-mode=false in server.properties"
            }
        } else {
            serverProps.parentFile.mkdirs()
            serverProps.text = "online-mode=false\neula=true\n"
            println "Created server.properties with online-mode=false"
        }
    }
}

tasks.matching { it.name == "runServer" }.configureEach {
    dependsOn "configureServerOfflineMode"
}

// Copy gametest structures to run directory before running tests
tasks.named("runGameTestServer") {
    dependsOn "copyGameTestStructures"
}

tasks.register("copyGameTestStructures", Copy) {
    from "src/main/resources/gameteststructures"
    into "run/gameteststructures"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Create Forge - slim jar (dependencies provided separately)
    modImplementation("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_forge_version}:slim") {
        transitive = false
    }

    // Create's dependencies
    modImplementation "net.createmod.ponder:Ponder-Forge-${rootProject.minecraft_version}:${rootProject.ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${rootProject.minecraft_version}:${rootProject.flywheel_version}"
    modLocalRuntime "dev.engine-room.flywheel:flywheel-forge-${rootProject.minecraft_version}:${rootProject.flywheel_version}"
    // Using local jar - maven.tterrag.com certificate expired 2025-12-23
    modImplementation files("libs/Registrate-MC1.20-1.3.3.jar")

    // MixinExtras - required by Create
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-forge:0.4.1"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
