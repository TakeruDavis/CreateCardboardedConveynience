plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$rootProject.minecraft_version-$project.name"
    }

    repositories {
        // Create mod dependencies
        maven {
            name = "devOS One Releases"
            url = "https://mvn.devos.one/releases"
        }
        maven {
            name = "devOS One Snapshots"
            url = "https://mvn.devos.one/snapshots"
        }
        maven {
            name = "Create Maven"
            url = "https://maven.createmod.net"
        }
        maven {
            name = "Tterrag Maven"
            url = "https://maven.tterrag.com/"
            // Note: Certificate expired 2025-12-23, using local jar for Forge Registrate
        }

        // CurseMaven for CurseForge mods
        maven {
            name = "CurseMaven"
            url = "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }

        // Modrinth for Modrinth mods
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // JamiesWhiteShirt's maven for reach-entity-attributes (Create dependency)
        maven {
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content {
                includeGroup "com.jamieswhiteshirt"
            }
        }

        // Jitpack for some dependencies
        maven {
            name = "Jitpack"
            url = "https://jitpack.io"
        }

        // Fuzs maven for Forge Config API Port
        maven {
            name = "Fuzs Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}
