plugins {
    id 'com.github.johnrengelman.shadow'
}

def modId = rootProject.mod_id

loom {
    neoForge {
        // Empty for now
    }

    runs {
        client {
            client()
            name "NeoForge Client"
            ideConfigGenerated true
        }

        server {
            server()
            name "NeoForge Server"
            ideConfigGenerated true
        }

        gameTestServer {
            server()
            name "Game Test Server"
            property "neoforge.enabledGameTestNamespaces", modId
            property "neoforge.gameTestServer", "true"
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Create NeoForge
    modImplementation("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_neoforge_version}:slim") {
        transitive = false
    }

    // Create's dependencies
    modImplementation "net.createmod.ponder:Ponder-NeoForge-${rootProject.minecraft_version}:${rootProject.ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${rootProject.minecraft_version}:${rootProject.flywheel_version}"
    modLocalRuntime "dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${rootProject.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${rootProject.registrate_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Exclude test classes from release jar
    exclude 'net/takerudavis/cardboarded_conveynience/test/**'
    exclude 'gameteststructures/**'
}

remapJar {
    input.set shadowJar.archiveFile
}
